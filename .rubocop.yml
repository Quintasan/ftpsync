plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 2.6

Metrics/AbcSize:
  Max: 20

Metrics/ClassLength:
  # Simple is the whole client: connection handling plus both directions, and
  # the test classes are grouped by transfer behaviour.
  Max: 260

Metrics/MethodLength:
  Max: 20